<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure File Download</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            overflow: hidden;
        }

        .download-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            z-index: 1;
        }

        h2 { color: #333; margin-bottom: 5px; font-size: 20px; word-wrap: break-word; }
        p { color: #777; margin-bottom: 25px; }

        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .download-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .download-btn:hover { background-color: #1557b0; }

        .error-msg {
            color: #d93025;
            font-size: 14px;
            display: none;
            margin-bottom: 15px;
            text-align: left;
        }

        /* --- METALLIC POPUP STYLING --- */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .metal-popup {
            background: linear-gradient(145deg, #e6e7ee, #9ea1a1);
            padding: 50px 30px;
            border-radius: 30px;
            border: 5px solid #ffffff;
            box-shadow: 0 0 50px rgba(0,0,0,0.6), inset 0 0 30px rgba(255,255,255,0.4);
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        .metal-text {
            font-size: 32px;
            font-weight: 900;
            line-height: 1.3;
            margin: 0;
            text-transform: uppercase;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-shift 3s linear infinite;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes rainbow-shift {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }
    </style>
</head>
<body>

    <div class="download-container">
        <h2>File Download</h2>
        <p>Google Drive Secure Access</p>
        
        <div id="errorMsg" class="error-msg">Incorrect password. Please try again.</div>
        <input type="password" id="passwordInput" placeholder="Enter Password">
        <button class="download-btn" onclick="startSecureDownload()">Submit & Download</button>
    </div>

    <div id="downloadPopup" class="popup-overlay">
        <div class="metal-popup">
            <h1 class="metal-text">File Is Downloading<br>Thanks For Download</h1>
        </div>
    </div>

    <script>
        function startSecureDownload() {
            const password = document.getElementById("passwordInput").value;
            const errorMsg = document.getElementById("errorMsg");
            const popup = document.getElementById("downloadPopup");

            // Password Check
            if (password === "1233") {
                errorMsg.style.display = "none";
                
                // Show the Colorful Metallic Popup
                popup.style.display = "flex";

                // New File ID from your link
                const fileId = "1G9Gb5Jw6dIzjv6vazrKcfPNSpR8VAmTh";
                const apiKey = "AIzaSyAPsiNIf14-uDcp5dFGaXd3oRXsvo8RsIQ";
                
                // Construct Download URL
                const downloadUrl = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${apiKey}&acknowledgeAbuse=true`;
                
                // Execute Download
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.target = "_blank"; 
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Auto-close popup after 10 seconds
                setTimeout(() => {
                    popup.style.display = "none";
                }, 10000);
                
            } else {
                errorMsg.style.display = "block";
            }
        }
    </script>

</body>
</html>
